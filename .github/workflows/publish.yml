name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (test build without publishing)'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  test-install:
    name: Test installation (${{ matrix.backend }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [minimal, tensorflow, pytorch]
        python-version: ["3.9", "3.10"]

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Install package (minimal)
      if: matrix.backend == 'minimal'
      run: pip install dist/*.whl

    - name: Install package (tensorflow)
      if: matrix.backend == 'tensorflow'
      run: |
        WHEEL=$(ls dist/*.whl)
        pip install "${WHEEL}[tensorflow]"

    - name: Install package (pytorch)
      if: matrix.backend == 'pytorch'
      run: |
        WHEEL=$(ls dist/*.whl)
        pip install "${WHEEL}[pytorch]"

    - name: Test import
      run: |
        python -c "import deel.influenciae; print(f'Version: {deel.influenciae.__version__}')"
        python -c "from deel.influenciae.common.backend import get_available_frameworks; print(f'Available: {get_available_frameworks()}')"

  publish:
    name: Publish to PyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    # Only publish on release or manual trigger with dry_run=false
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    environment:
      name: pypi
      url: https://pypi.org/p/Influenciae

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.INFLUENCIAE_TOKEN }}
