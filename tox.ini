[tox]
envlist =
    py{38,39,310,311}-minimal
    py{38,39,310,311}-tensorflow
    py{38,39,310,311}-pytorch
    py{38,39,310,311}-all
    py{38,39,310,311}-lint

[testenv]
deps =
    # Core test dependencies
    pytest>=7.0.0
    pytest-cov>=4.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0

    # Backend-specific dependencies
    tensorflow: tensorflow>=2.7.0,<2.16.0
    pytorch: torch>=1.9.0
    all: tensorflow>=2.7.0,<2.16.0
    all: torch>=1.9.0

commands =
    # Run tests with appropriate backend selection
    minimal: pytest --backend=minimal --cov=deel/influenciae {posargs}
    tensorflow: pytest --backend=tensorflow --cov=deel/influenciae {posargs}
    pytorch: pytest --backend=pytorch --cov=deel/influenciae {posargs}
    all: pytest --backend=all --cov=deel/influenciae {posargs}

setenv =
    MPLBACKEND=Agg
    CUDA_VISIBLE_DEVICES=
    # Suppress TensorFlow warnings
    TF_CPP_MIN_LOG_LEVEL=2

passenv =
    INFLUENCIAE_BACKEND
    CI
    GITHUB_ACTIONS

[testenv:py{38,39,310,311}-lint]
skip_install = true
deps =
    pylint>=2.15.0
    numpy>=1.19.0
commands =
    python -m pylint deel/influenciae

[testenv:typecheck]
skip_install = true
deps =
    mypy>=1.0.0
    mypy-extensions>=1.0.0
    numpy>=1.19.0
commands =
    mypy deel/influenciae --ignore-missing-imports

# Convenience environments for local development
[testenv:quick]
description = Quick test run with minimal backend (fastest)
deps =
    pytest>=7.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0
commands =
    pytest --backend=minimal -x -q {posargs}

[testenv:coverage]
description = Run tests with all backends and generate coverage report
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0
    tensorflow>=2.7.0,<2.16.0
    torch>=1.9.0
commands =
    pytest --backend=all --cov=deel/influenciae --cov-report=html --cov-report=term-missing {posargs}
setenv =
    MPLBACKEND=Agg
    CUDA_VISIBLE_DEVICES=
    TF_CPP_MIN_LOG_LEVEL=2

