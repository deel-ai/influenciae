[tox]
envlist =
    py{311,312,313}-minimal
    py311-tensorflow-{min,max}
    py312-tensorflow-{min,max}
    py313-tensorflow-{min,max}
    py311-pytorch-{min,max}
    py312-pytorch-{min,max}
    py313-pytorch-{min,max}
    py311-all-{min,max}
    py312-all-{min,max}
    py313-all-{min,max}
    lint
    typecheck

[testenv]
deps =
    # Core test dependencies
    pytest>=7.0.0
    pytest-cov>=4.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0

    # Backend-specific dependencies
    tensorflow: tensorflow>=2.11.0,<2.21.0
    pytorch: torch>=2.0.0,<2.11.0
    all: tensorflow>=2.11.0,<2.21.0
    all: torch>=2.0.0,<2.11.0

    # NumPy compatibility pins for backend-specific minimums
    py311-pytorch-min: numpy==1.26.4
    py312-pytorch-min: numpy==1.26.4
    # TensorFlow 2.12.0 requires numpy<1.24
    py311-all-min: numpy==1.23.5
    py312-all-min: numpy==1.26.4

    # TensorFlow compatibility bounds per Python version
    py311-tensorflow-min: tensorflow==2.12.0
    py312-tensorflow-min: tensorflow==2.16.1
    py313-tensorflow-min: tensorflow==2.20.0
    tensorflow-max: tensorflow==2.20.0

    # PyTorch compatibility bounds per Python version
    py311-pytorch-min: torch==2.0.0
    py312-pytorch-min: torch==2.2.0
    py313-pytorch-min: torch==2.5.0
    pytorch-max: torch==2.10.0

    # Dual-backend compatibility bounds per Python version
    py311-all-min: tensorflow==2.12.0
    py311-all-min: torch==2.0.0
    py312-all-min: tensorflow==2.16.1
    py312-all-min: torch==2.2.0
    py313-all-min: tensorflow==2.20.0
    py313-all-min: torch==2.5.0
    all-max: tensorflow==2.20.0
    all-max: torch==2.10.0

commands =
    # Run tests with appropriate backend selection
    # Coverage is handled separately by the dedicated coverage environment
    minimal: pytest tests/ --backend=minimal -v {posargs}
    tensorflow: pytest tests/ --backend=tensorflow -v {posargs}
    pytorch: pytest tests/ --backend=pytorch -v {posargs}
    all: pytest tests/ --backend=all -v {posargs}

setenv =
    MPLBACKEND=Agg
    CUDA_VISIBLE_DEVICES=
    # Suppress TensorFlow warnings
    TF_CPP_MIN_LOG_LEVEL=2
    # Ensure pytest uses the correct conftest
    PYTHONDONTWRITEBYTECODE=1

passenv =
    INFLUENCIAE_BACKEND
    CI
    GITHUB_ACTIONS

[testenv:lint]
skip_install = true
deps =
    pylint>=2.15.0
    numpy>=1.19.0
commands =
    python -m pylint deel/influenciae

[testenv:typecheck]
skip_install = true
deps =
    mypy>=1.0.0
    mypy-extensions>=1.0.0
    numpy>=1.19.0
commands =
    mypy deel/influenciae

# Convenience environments for local development
[testenv:quick]
description = Quick test run with minimal backend (fastest)
deps =
    pytest>=7.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0
commands =
    pytest --backend=minimal -x -q {posargs}

[testenv:coverage]
description = Run tests with all backends and generate coverage report
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    numpy>=1.19.0
    matplotlib>=3.3.0
    tensorflow>=2.11.0,<2.21.0
    torch>=2.0.0,<2.11.0
commands =
    pytest --backend=all --cov=deel/influenciae --cov-report=html --cov-report=term-missing {posargs}
setenv =
    MPLBACKEND=Agg
    CUDA_VISIBLE_DEVICES=
    TF_CPP_MIN_LOG_LEVEL=2

